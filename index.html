<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경영정보시스템 포트폴리오</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: #f8f2f0;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>나의 포트폴리오</h1>
        <p>경영정보론 과제로 제작한 포트폴리오 웹사이트입니다.</p>
        <p>내용을 자유롭게 추가할 수 있습니다.</p>
    </div>
</body>
</html>
